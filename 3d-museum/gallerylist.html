    .feature-banner {

      position: relative;
    }
    .feature-banner .badge { position: absolute; top: 20px; left: 20px; font-size: 11px; letter-spacing: 2px; color: var(--gold); border: 1px solid var(--gold-deep); padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,0.3); }

    .feature-banner p { max-width: 500px; font-size: 14px; line-height: 1.8; color: var(--ink-soft); }

    .section-title .count { font-size: 12px; color: var(--ink-soft); }

    .card { background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: all 0.3s; cursor: pointer; text-decoration: none; color: inherit; display: block; }

    .card .info { padding: 14px; }
    .card .name { font-size: 15px; letter-spacing: 2px; margin-bottom: 4px; }
    .card .era { font-size: 11px; color: var(--ink-soft); }

  <script type="module">

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // banner 3D模型
    const canvas = document.getElementById("banner-canvas");
    if (canvas) {
      const scene = new THREE.Scene();
      scene.background = null;
      const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
      camera.position.set(0, 1, 3);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      const light = new THREE.DirectionalLight(0xffffff, 1.5);
      light.position.set(5, 10, 7);
      scene.add(light);
      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.target.set(0, 0.5, 0);

      const loader = new GLTFLoader();
      loader.load("/my_art/siyangfangzun.glb", (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const scale = 3.5 / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));
        scene.add(model);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = canvas.clientWidth / canvas.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      });
    }

      hallTitle.style.cssText = "grid-column: 1 / -1; margin: 24px 0 12px; padding: 0 4px; display: flex; align-items: center; gap: 12px;";
      hallTitle.innerHTML = `
        <span style="width:40px;height:40px;border-radius:50%;background:rgba(201,169,97,0.15);display:grid;place-items:center;color:#c9a961;font-size:18px;">${hall.glyph}</span>
        <div>
          <div style="font-size:18px;color:#fff;letter-spacing:2px;">${hall.name}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:1px;">${hall.sub} · ${hallArts.length} 件展品</div>
        </div>
      `;
      artGrid.appendChild(hallTitle);

      // 该场馆的文物卡片
      hallArts.forEach((art) => {
        const card = document.createElement("a");
        card.href = `/gallerydistract.html?id=${art.id}`;
        card.className = "card";
        card.dataset.model = art.id;
        card.innerHTML = `
          <div class="img"><canvas style="width:100%;height:100%;"></canvas></div>
          <div class="info"><div class="name">${art.name}</div><div class="era">${art.era}</div></div>
        `;
        artGrid.appendChild(card);
      });
    });

    // 创建共享离屏渲染器
    const scRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    scRenderer.setPixelRatio(1);
    scRenderer.setSize(300, 300, false);
    const scScene = new THREE.Scene();
    scScene.background = new THREE.Color(0xefe3c4);
    const scCamera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
    scCamera.position.set(0, 0.7, 3.5);
    scCamera.lookAt(0, 0, 0);

    scScene.add(
      new THREE.HemisphereLight("#ffffff", "#cbb27e", 1.35),
      (() => { const l = new THREE.DirectionalLight("#fff2d8", 2.4); l.position.set(3, 5, 4); return l; })(),
      (() => { const l = new THREE.DirectionalLight("#ffe6f0", 1.1); l.position.set(-3, 1, -4); return l; })(),
    );

    const scGltfLoader = new GLTFLoader();
    const scDraco = new DRACOLoader();
    scDraco.setDecoderPath("/echo/draco/");
    scGltfLoader.setDRACOLoader(scDraco);

    function fitModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = maxDim > 0 ? 1.8 / maxDim : 1;
      model.scale.setScalar(scale);
      model.position.copy(center).multiplyScalar(-scale);
      model.position.y += 0.1;
    }

    async function renderCardShots() {
      // 缓存机制：从 localStorage 读取已渲染的缩略图
      const CACHE_KEY = "gallery_thumb_cache_v1";
      let thumbCache = {};
      try {
        thumbCache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");
      } catch {}

      for (const art of ALL_ARTIFACTS) {
        const card = document.querySelector(`.card[data-model="${art.id}"]`);
        if (!card) continue;
        const imgContainer = card.querySelector(".img");
        if (!imgContainer) continue;

        // 命中缓存直接用
        if (thumbCache[art.id]) {
          imgContainer.innerHTML = `<img src="${thumbCache[art.id]}" alt="${art.name}" style="width:100%;height:100%;object-fit:contain;" />`;
          continue;
        }

        try {
          const gltf = await new Promise((resolve, reject) => {
            scGltfLoader.load(art.model, resolve, undefined, reject);
          });
          const model = gltf.scene;
          fitModel(model);
          scScene.add(model);
          scRenderer.render(scScene, scCamera);
          const dataUrl = scRenderer.domElement.toDataURL("image/png");
          scScene.remove(model);

          imgContainer.innerHTML = `<img src="${dataUrl}" alt="${art.name}" style="width:100%;height:100%;object-fit:contain;" />`;

          // 写入缓存
          thumbCache[art.id] = dataUrl;
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(thumbCache));
          } catch {}

          model.traverse((child) => {
            if (child instanceof THREE.Mesh) {
              child.geometry.dispose();
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach((m) => m.dispose());
            }
          });
        } catch (err) {
          console.error(`加载 ${art.id} 失败:`, err);
          imgContainer.innerHTML = `<div style="width:100%;height:100%;display:grid;place-items:center;color:#c9a961;font-size:24px;">${art.name.charAt(0)}</div>`;
        }
      }
    }

    renderCardShots();
  </script>
</body>
</html>
